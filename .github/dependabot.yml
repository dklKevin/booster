# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Watch GitHub Actions in .github/workflows.
  # directory must be "/" — Dependabot does not accept /.github/workflows here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
